<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turmalina Café -- Dashboard de Análise de Lojas</title>
    <link href="/styles/main.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/htmx/1.9.10/htmx.min.js"></script>
</head>
<body>

<header class="app-header">
    <div class="header-left">
        <a href="/" class="brand">
            <span class="brand-mark">T</span>
            <span>Rede Turmalina Café</span>
        </a>

        <nav class="main-nav">
            <a href="/" hx-get="/" hx-target="#main-content" hx-swap="innerHTML" hx-push-url="true"
               class="nav-link {{ 'active' if active_tab == 'prioridades' else '' }}">
                Prioridades<span class="nav-badge">{{ n_criticas or 2 }}</span>
            </a>
            <a href="/analise" hx-get="/analise" hx-target="#main-content" hx-swap="innerHTML" hx-push-url="true"
               class="nav-link {{ 'active' if active_tab == 'individual' else '' }}">
                Análise Individual
            </a>
        </nav>
    </div>

    <div class="header-right">
        <button class="icon-btn tooltip" data-tooltip="Semana atual" aria-label="Calendário">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
        </button>
        <button class="icon-btn tooltip" data-tooltip="Sem notificações novas" aria-label="Notificações">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.4-1.4A2 2 0 0118 14.2V11a6 6 0 10-12 0v3.2c0 .5-.2 1-.6 1.4L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
            </svg>
        </button>
        <div class="user-block">
            <span class="avatar">MS</span>
            <div>
                <div class="user-name">Marina Salles</div>
                <div class="user-role">Diretora</div>
            </div>
        </div>
        <button class="btn btn-neutral"
                hx-get="/relatorio"
                hx-target="#report-modal-body"
                hx-swap="innerHTML"
                onclick="report_modal.showModal()">
            Generate Report
        </button>
    </div>
</header>

<div class="layout">
    <aside class="sidebar">
        <div class="sidebar-title">NOSSAS LOJAS</div>
        <ul class="store-list">
            {% for loja in lojas_sidebar %}
            <li>
                <a href="/lojas/{{ loja.id_loja }}"
                   hx-get="/lojas/{{ loja.id_loja }}"
                   hx-target="#main-content"
                   hx-swap="innerHTML"
                   hx-push-url="/lojas/{{ loja.id_loja }}"
                   class="store-link {{ 'active' if loja.id_loja == active_loja else '' }}">
                    <span class="dot {{ 'dot-error' if loja.risco_critico else '' }}"></span>
                    <span class="store-name">{{ loja.nome_loja }}</span>
                </a>
            </li>
            {% endfor %}
        </ul>
    </aside>

    <main id="main-content" class="main-content">
        {% include conteudo_inicial %}
    </main>
</div>

<dialog id="report_modal" class="modal">
    <div class="modal-box" id="report-modal-body">
        <span class="loading-spinner"></span>
    </div>
    <div class="modal-actions">
        <form method="dialog">
            <button class="btn">Fechar</button>
        </form>
    </div>
</dialog>

</body>
</html>
